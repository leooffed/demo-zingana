<section id="booking" class="section-padding booking-full">
  <div class="container">
    <div class="section-title">
      <span style="color: #ccc">Reservations</span>
      <h2 style="color: white">Book Your Stay</h2>
    </div>
    <div class="booking-form-container fade-in-up">
      <form id="reservationForm" onsubmit="handleBooking(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="John Doe" required />
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" placeholder="john@example.com" required />
          </div>
          <div class="form-group">
            <label>Check-in Date</label>
            <input type="date" id="checkInFull" required />
          </div>
          <div class="form-group">
            <label>Check-out Date</label>
            <input type="date" id="checkOutFull" required />
          </div>
          <div class="form-group">
            <label>Room Type</label>
            <select id="roomSelect">
              <option value="Standard Room">Standard Room</option>
              <option value="Deluxe Room">Deluxe Room</option>
              <option value="Executive Suite">Executive Suite</option>
              <option value="VIP Suite">VIP Suite</option>
            </select>
          </div>
          <div class="form-group">
            <label>Guests</label>
            <select>
              <option>1 Person</option>
              <option>2 People</option>
              <option>3 People</option>
              <option>4+ People</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Special Requests</label>
          <input type="text" placeholder="Late check-in, high floor, etc." />
        </div>
        <div class="text-center" style="margin-top: 20px">
          <button
            type="submit"
            class="btn btn-primary"
            style="width: 100%; max-width: 300px"
          >
            Confirm Reservation
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
