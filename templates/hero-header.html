<!-- Hero Section -->
<header id="home" class="hero">
  <div class="container hero-content fade-in-up">
    <h1>Experience Luxury & Comfort in the Heart of Bafoussam</h1>
    <p>
      Premium hospitality, elegant rooms, and unforgettable experiences tailored
      for every guest.
    </p>

    <div class="hero-btns">
      <a href="#booking" class="btn btn-primary">Book Now</a>
      <a
        href="#rooms"
        class="btn btn-outline"
        style="border-color: white; color: white"
        >Explore Rooms</a
      >
    </div>

    <!-- Booking Widget Hero -->
    <div class="booking-widget fade-in-up">
      <div class="booking-item">
        <label>Check In</label>
        <input type="date" id="checkInHero" />
      </div>
      <div class="booking-item">
        <label>Check Out</label>
        <input type="date" id="checkOutHero" />
      </div>
      <div class="booking-item">
        <label>Guests</label>
        <select>
          <option>1 Adult</option>
          <option>2 Adults</option>
          <option>2 Adults, 1 Child</option>
          <option>Family (4+)</option>
        </select>
      </div>
      <div class="booking-item" style="justify-content: flex-end">
        <button class="btn btn-primary" onclick="scrollToBooking()">
          Check Availability
        </button>
      </div>
    </div>
  </div>
</header>
